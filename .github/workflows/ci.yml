name: CI

on:
  pull_request:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-runtime.lock
            requirements-build.txt
            requirements-test.txt
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config libegl1 ffmpeg
      - name: Install Windows libraries
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install pinned dependencies and package
        shell: bash
        run: |
          python -m pip install --require-hashes -r requirements-runtime.lock
          python -m pip install -r requirements-build.txt -r requirements-test.txt
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check
      - name: Validate runtime version (Linux)
        if: runner.os == 'Linux'
        run: python cove_converter/version.py --version "$(python -c 'import cove_converter; print(cove_converter.__version__)')" --project pyproject.toml
      - name: Validate runtime version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = python -c "import cove_converter; print(cove_converter.__version__)"
          python cove_converter/version.py --version $version --project pyproject.toml
      - name: Run unit tests
        run: python -m pytest tests -q
      - name: Run representative conversion smoke tests
        if: matrix.python == '3.12'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/smoke_conversions.py --quiet --input .ndjson --input .srt --input .cbz
